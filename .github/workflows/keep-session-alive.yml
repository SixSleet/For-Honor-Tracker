# Keeps the shared Ubisoft session alive.
#
# The ticket Ubisoft issues lasts about two hours. If nothing renews it in that
# window the session lapses, the site silently drops back to Steam-only data,
# and it takes a manual re-seed to bring it back — which is exactly what
# happened once. Vercel Cron on the Hobby plan only runs daily, so the schedule
# that actually matters lives here.
#
# There is nothing to set up. No secret is stored in this repository and none
# needs to be: the job asks GitHub for a short-lived OIDC token describing this
# run, and the site verifies it against GitHub's published signing keys and
# checks that the run belongs to this repository. See src/server/github-oidc.ts.
name: Keep session alive

on:
  schedule:
    # Every 30 minutes. GitHub delays scheduled runs under load, so a 30-minute
    # cadence is what reliably lands inside the ~2-hour ticket window.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Never let two refreshes overlap, and drop a queued one rather than piling up
# a backlog if GitHub runs late.
concurrency:
  group: keep-session-alive
  cancel-in-progress: false

permissions:
  # The only permission the job needs, and the reason it needs no secret.
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh the Ubisoft session
        env:
          SITE: https://for-honor-tracker.vercel.app
          AUDIENCE: for-honor-tracker-session-refresh
        run: |
          set -euo pipefail

          # Mint the identity token for this run. Both variables are injected
          # by the runner because of `id-token: write` above.
          token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          # --fail-with-body so a rejection still prints why. The token is
          # short-lived and audience-scoped, but it goes in a header rather
          # than the URL so it stays out of the run log either way.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -H "Authorization: Bearer ${token}" \
            "${SITE}/api/ubisoft-refresh"
          echo
